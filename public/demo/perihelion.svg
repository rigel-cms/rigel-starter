<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-labelledby="title">
  <title id="title">Perihelion: an elliptical orbit around a sun</title>
  <style>svg{color:#19345f;color-scheme:light}</style>
  <g transform="rotate(-35 31 32)">
    <ellipse cx="31" cy="32" rx="26" ry="14" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="20" cy="32" r="6" fill="currentColor"/>
    <circle cx="57" cy="32" r="4" fill="currentColor"/>
  </g>
  <text x="69" y="41" fill="currentColor" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" letter-spacing="-1.2">perihelion</text>
</svg>
